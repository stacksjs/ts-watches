name: Releaser

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Requested up front so npm trusted publishing works the moment OIDC is
  # configured, without another workflow change.
  id-token: write

jobs:
  npm:
    name: npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # Changelog generation walks from the previous tag, so it needs real
          # history rather than a shallow clone.
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      # Without this every package publishes as a bare package.json: each one
      # declares `files: ["dist"]`, and dist only exists once this has run.
      - name: Build
        run: bun run build

      - name: Publish ts-watches
        uses: pantry-pm/pantry/packages/action@v0.10.51
        with:
          install: 'false'
          publish: npm
          package-dir: packages/ts-watches
        env:
          # npm auth comes from the environment; the action's `token`
          # input is the pantry registry credential, a different thing.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish ts-garmin
        uses: pantry-pm/pantry/packages/action@v0.10.51
        with:
          install: 'false'
          publish: npm
          package-dir: packages/ts-garmin
        env:
          # npm auth comes from the environment; the action's `token`
          # input is the pantry registry credential, a different thing.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish ts-trainingpeaks
        uses: pantry-pm/pantry/packages/action@v0.10.51
        with:
          install: 'false'
          publish: npm
          package-dir: packages/ts-trainingpeaks
        env:
          # npm auth comes from the environment; the action's `token`
          # input is the pantry registry credential, a different thing.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Notes come from git history between the previous tag and this one, so a
      # release never depends on someone remembering to edit CHANGELOG.md.
      #
      # Notes-only: the build produces a single binary for the runner's own
      # platform, and attaching that as though it were "the" download is worse
      # than attaching nothing. Cross-compiled artifacts can be added here when
      # the build produces them.
      - name: GitHub release
        uses: pantry-pm/pantry/packages/action@v0.10.51
        with:
          install: 'false'
          release: 'true'
          release-files: none
          # Left at the default (CHANGELOG.md). `auto` regenerates notes from
          # git history, but hard-fails when logsmith produces nothing rather
          # than falling through - and it produces nothing for a first release,
          # which has no previous tag to walk from. File extraction does fall
          # through to release-notes below, so both the first release and every
          # later one get notes.
          release-notes: |
            Initial release.

            TypeScript library for downloading, parsing and analysing data from
            smartwatches and fitness devices: Garmin, Polar, Suunto, Coros,
            Wahoo and Apple Watch, with FIT parsing, cloud integrations and
            training analysis.
          release-token: ${{ secrets.GITHUB_TOKEN }}
